name: Verify candidate
on:
  pull_request:
  push:
    branches: [main, public-preview]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  # Supersede a branch's own earlier pushes, but let every commit that reaches a
  # release branch finish: a cancelled push run leaves that commit with no verdict
  # and no main-<sha> package.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install pinned static analyzer
        shell: powershell
        run: |
          Install-PackageProvider NuGet -MinimumVersion 2.8.5.201 -Scope CurrentUser -Force
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force -Repository PSGallery
      - name: Static and policy checks
        shell: powershell
        run: .\scripts\check.ps1
      - name: Offline regression and installation suites
        shell: powershell
        run: .\scripts\test.ps1
      - name: Scan Git history for secrets
        shell: powershell
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'gitleaks.zip'
          Invoke-WebRequest 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip' -OutFile $archive
          $expected = 'd29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected) { throw 'Scanner checksum mismatch' }
          $tool = Join-Path $env:RUNNER_TEMP 'gitleaks'
          Expand-Archive -LiteralPath $archive -DestinationPath $tool
          & (Join-Path $tool 'gitleaks.exe') git . --redact --no-banner
          if ($LASTEXITCODE -ne 0) { throw 'Secret scan failed' }
      - name: Build candidate archive
        shell: powershell
        run: .\scripts\package.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hotpl8-windows-candidate
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - name: Render fictional PR preview
        if: github.event_name == 'pull_request'
        shell: powershell
        run: ./scripts/screenshots.ps1
      - name: Store inert preview images
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-images
          path: docs/assets/*.png
          retention-days: 30
  publish-main:
    needs: windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Download the tested package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: gh run download $env:GITHUB_RUN_ID --name hotpl8-windows-candidate --dir tested
      - name: Add exact source identity
        shell: powershell
        run: |
          $package = @(Get-ChildItem tested -Filter '*.zip')
          if ($package.Count -ne 1) { throw 'Expected one tested archive' }
          python delivery/package.py $package[0].FullName hotpl8-main.zip --sha $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Delivery packaging failed' }
      - name: Attest tested main package
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: hotpl8-main.zip
      - name: Publish retained main package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $tag = 'main-' + $env:GITHUB_SHA
          # Listing succeeds for an empty release set. An expected 404 written
          # to stderr becomes a terminating NativeCommandError in PowerShell 5.1.
          $releaseText = gh api ('repos/' + $env:GITHUB_REPOSITORY + '/releases?per_page=100')
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect existing releases' }
          $releases = $releaseText | ConvertFrom-Json
          $existing = @($releases | Where-Object tag_name -EQ $tag)
          if ($existing.Count -gt 0) {
            $existing = $existing[0]
            $assets = @($existing.assets | Where-Object name -EQ 'hotpl8-main.zip')
            $expected = 'sha256:' + (Get-FileHash hotpl8-main.zip -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($existing.draft -or $assets.Count -ne 1 -or $assets[0].digest -cne $expected) { throw 'Existing release differs; refusing replacement.' }
            Write-Output 'Identical immutable release already published.'
            exit 0
          }
          gh release create $tag hotpl8-main.zip --target $env:GITHUB_SHA --prerelease --title ('Tested main ' + $env:GITHUB_SHA.Substring(0,12)) --notes ('Automatic main-channel package for commit ' + $env:GITHUB_SHA + '. Ordinary stable installations are unchanged.')
          if ($LASTEXITCODE -ne 0) { throw 'Main publication failed' }
