name: Verify candidate
on:
  pull_request:
  push:
    branches: [main, public-preview]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  # Supersede a branch's own earlier pushes, but let every commit that reaches a
  # release branch finish: a cancelled push run leaves that commit with no verdict
  # and no main-<sha> package.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install pinned static analyzer
        shell: powershell
        run: |
          Install-PackageProvider NuGet -MinimumVersion 2.8.5.201 -Scope CurrentUser -Force
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force -Repository PSGallery
      - name: Static and policy checks
        shell: powershell
        run: .\scripts\check.ps1
      - name: Build and test the native reader
        shell: powershell
        run: |
          Push-Location native
          rustup show active-toolchain
          if ($LASTEXITCODE -ne 0) { rustup toolchain install; if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain install failed' } }
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { throw 'Native reader tests failed' }
          Pop-Location
          .\scripts\build-native.ps1 -Target x86_64-pc-windows-msvc
      - name: Offline regression and installation suites
        shell: powershell
        run: .\scripts\test.ps1
      - name: Scan Git history for secrets
        shell: powershell
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'gitleaks.zip'
          Invoke-WebRequest 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip' -OutFile $archive
          $expected = 'd29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected) { throw 'Scanner checksum mismatch' }
          $tool = Join-Path $env:RUNNER_TEMP 'gitleaks'
          Expand-Archive -LiteralPath $archive -DestinationPath $tool
          & (Join-Path $tool 'gitleaks.exe') git . --redact --no-banner
          if ($LASTEXITCODE -ne 0) { throw 'Secret scan failed' }
      - name: Build candidate archive
        shell: powershell
        run: .\scripts\package.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hotpl8-windows-candidate
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - name: Render fictional PR preview
        if: github.event_name == 'pull_request'
        shell: powershell
        run: ./scripts/screenshots.ps1
      - name: Store inert preview images
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-images
          path: docs/assets/*.png
          retention-days: 30
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Static and policy checks
        shell: pwsh
        run: ./scripts/check.ps1
      - name: Build and test the native reader
        shell: pwsh
        run: |
          Push-Location native
          rustup show active-toolchain
          if ($LASTEXITCODE -ne 0) { rustup toolchain install; if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain install failed' } }
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { throw 'Native reader tests failed' }
          Pop-Location
          ./scripts/build-native.ps1
      - name: Shared delivery, publication and bridge regressions on Mac
        shell: bash
        run: |
          python tests/test_delivery.py
          python tests/test_publish_main.py
          python tests/test_macos_lock.py
          python tests/test_macos_launch.py
          node --test tests/test-t3-codex.mjs
      - name: Native Mac delivery and enabled-surface regression suites
        shell: pwsh
        run: ./scripts/test-macos-delivery.ps1
      - name: Build Mac candidate archive
        shell: pwsh
        run: ./scripts/package.ps1 -Platform macos
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hotpl8-macos-candidate
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
  publish-main:
    needs: [windows, macos]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Download the tested packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          gh run download $env:GITHUB_RUN_ID --name hotpl8-windows-candidate --dir tested/windows
          if ($LASTEXITCODE -ne 0) { throw 'Windows candidate download failed' }
          gh run download $env:GITHUB_RUN_ID --name hotpl8-macos-candidate --dir tested/macos
          if ($LASTEXITCODE -ne 0) { throw 'Mac candidate download failed' }
      - name: Add exact source identity
        shell: powershell
        run: |
          foreach ($platform in @('windows', 'macos')) {
            $package = @(Get-ChildItem (Join-Path tested $platform) -Filter '*.zip')
            if ($package.Count -ne 1) { throw ('Expected one tested ' + $platform + ' archive') }
            $output = if ($platform -eq 'windows') { 'hotpl8-main.zip' } else { 'hotpl8-macos-main.zip' }
            python delivery/package.py $package[0].FullName $output --sha $env:GITHUB_SHA --platform $platform
            if ($LASTEXITCODE -ne 0) { throw ('Delivery packaging failed: ' + $platform) }
          }
      - name: Attest tested main packages
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            hotpl8-main.zip
            hotpl8-macos-main.zip
      - name: Publish retained main packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          python scripts/publish-main.py --repository $env:GITHUB_REPOSITORY --sha $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Main publication failed' }
