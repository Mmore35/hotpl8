name: Bug report
description: Report a reproducible HotPl8 problem.
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Version and redacted diagnostics
      description: Review hotpl8 doctor -AsJson output. Never attach tokens, real labels, native auth files, or whole state directories.
